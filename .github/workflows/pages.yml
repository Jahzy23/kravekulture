name: Deploy redirect to GitHub Pages

# The live site is on Vercel; GitHub Pages only serves the tiny redirect/ shim,
# so this only needs to run when the shim (or this file) changes.
on:
  push:
    branches: [main]
    paths:
      - "redirect/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions are pinned to commit SHAs (tag in the comment) so a moved tag cannot
      # swap the code that gets `id-token: write` here. Bump by updating both.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
