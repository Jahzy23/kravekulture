<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Krave Kulture - Haitian &amp; Soul Food Truck, Miami</title>
  <meta name="description" content="Scroll through the world of Krave Kulture: Little Haiti market, the trailer kitchen, the truck at sunset, the complete plate, wings and fries. Haitian, Caribbean and soul food in Miami, FL.">
  <meta name="theme-color" content="#f6f4ee">
  <meta property="og:title" content="Krave Kulture - Haitian &amp; Soul Food Truck, Miami">
  <meta property="og:description" content="Krave It. Taste It. Live the Kulture. See the menu and today's spot.">
  <meta property="og:image" content="world/truck.webp">
  <meta property="og:type" content="website">
  <link rel="icon" href="images/logo-150.jpg">
  <link rel="apple-touch-icon" href="images/logo-300.png">
  <link rel="preload" href="fonts/bungee-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/big-shoulders-text.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="world/market.webp" as="image">
  <style>
    @font-face { font-family: "Bungee"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/bungee-400.woff2) format("woff2"); }
    @font-face { font-family: "Big Shoulders Text"; font-style: normal; font-weight: 400 700; font-display: swap; src: url(fonts/big-shoulders-text.woff2) format("woff2"); }

    /* Theme the engine with the storefront tokens. Unlayered, so it wins over the engine's @layer defaults. */
    :root, .sw-root {
      --sw-bg: #f6f4ee;            /* == the stills' background */
      --sw-ink: #111111;
      --sw-ink-soft: #55534e;
      --sw-accent: #c4261d;        /* per-section accents override at runtime */
      --sw-font-display: "Bungee", Impact, "Arial Narrow", sans-serif;
      --sw-font-body: "Big Shoulders Text", "Arial Narrow", "Helvetica Neue", sans-serif;
    }
    .sw-root { font-size: 18px; }
    .sw-root .sw-copy__title { font-weight: 400; letter-spacing: 0.01em; line-height: 0.98; }
    .sw-root .sw-copy__eyebrow { font-family: var(--sw-font-body); font-weight: 700; letter-spacing: 0.14em; }
    .sw-root .sw-copy__body { font-weight: 500; font-size: clamp(1.1rem, 1.35vw, 1.3rem); line-height: 1.4; }
    .sw-root .sw-copy__num { font-family: var(--sw-font-body); font-weight: 700; }
    .sw-root .sw-copy__tags li { font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.78rem; border-radius: 0; }
    .sw-root .sw-btn, .sw-root .sw-topcta, .sw-root .sw-nav, .sw-root .sw-nav__item, .sw-root .sw-route__label { border-radius: 0; }
    .sw-root .sw-btn, .sw-root .sw-topcta { font-family: var(--sw-font-display); font-weight: 400; letter-spacing: 0.04em; font-size: 0.85rem; }
    .sw-root .sw-btn--primary { background: var(--sw-accent); }
    .sw-root .sw-nav__item { font-family: var(--sw-font-display); font-size: 0.7rem; letter-spacing: 0.04em; }
    .sw-root .sw-brand__name { font-size: 1.15rem; letter-spacing: 0.02em; }
    .sw-root .sw-brand__mark { display: none; }
    .sw-root .sw-brand__badge { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; box-shadow: 0 6px 14px -6px rgba(17, 17, 17, 0.6); }
    /* No scroll-cue affordance: the diorama itself signals there's more (Krave Kulture design taste pass). */
    .sw-root .sw-hint { display: none; }
    ::selection { background: #f2b632; color: #111; }
    :focus-visible { outline: 3px solid #18359c; outline-offset: 3px; }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>

  <script src="world/scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'Krave Kulture', href: '#top' },
      cta: { label: 'Menu', href: 'menu.html' },
      hint: 'Scroll to fly in',
      diveScroll: 1.3,
      connScroll: 0.9,
      sections: [
        {
          id: 'market', label: 'Market',
          still: 'world/market.webp',
          accent: '#c4261d',
          scroll: 1.5, linger: 0.3,
          eyebrow: 'From the market',
          title: 'It starts in Little Haiti.',
          body: 'Plantains, scotch bonnets, cabbage for the pikliz. Picked fresh and cooked the way home does it.',
          tags: ['Haitian', 'Caribbean', 'Soul food'],
        },
        {
          id: 'kitchen', label: 'Kitchen',
          still: 'world/kitchen.webp',
          accent: '#18359c',
          eyebrow: 'In the trailer',
          title: 'Griot fried crisp. Wings sauced hot.',
          body: 'One small kitchen on wheels. Everything cooked to order while you wait at the window.',
          tags: ['Cooked to order'],
        },
        {
          id: 'truck', label: 'The truck',
          still: 'world/truck.webp',
          accent: '#111111',
          scroll: 1.5, linger: 0.35,
          eyebrow: 'Find the truck',
          title: 'Same truck. New spot every week.',
          body: 'We move around Miami. Today’s location is always on Instagram.',
          tags: ['Miami, FL', '@eatkravekulture'],
        },
        {
          id: 'plate', label: 'The complete',
          still: 'world/plate.webp',
          accent: '#c4261d',
          scroll: 1.6, linger: 0.4,
          eyebrow: 'The complete',
          title: 'Rice. Meat. Plantain. Mac.',
          body: 'Every plate comes complete. Griot, goat, turkey, shrimp, chicken, boulet or rib.',
          tags: ['7 completes', 'From $20'],
        },
        {
          id: 'wings', label: 'Wings',
          still: 'world/wings.webp',
          accent: '#18359c',
          eyebrow: 'Wings & fries',
          title: 'Four flavors. Pick your heat.',
          body: 'Honey hot, lemon pepper, BBQ or buffalo. Six, eight or ten pieces, fries included.',
          tags: ['6 / 8 / 10 pc', 'From $12'],
        },
        {
          id: 'finale', label: 'Sweet finish',
          still: 'world/finale.webp',
          accent: '#111111',
          scroll: 1.6, linger: 0.4,
          eyebrow: 'Sweet finish',
          title: 'Banana pudding and a cold Kravelade.',
          body: 'Krave it. Taste it. Live the Kulture.',
          tags: [],
          cta: { primary: { label: 'See the menu', href: 'menu.html' },
                 secondary: { label: 'How to pay', href: 'menu.html#pay' } },
        },
      ],
      // Video chain not rendered yet (stills-only build). When the dive/connector clips exist,
      // add clip: 'world/vid/<id>.mp4' per section and list world/vid/conn1..5.mp4 here.
      connectors: [],
    });

    // Swap the engine's generic brand mark for the badge.
    (function () {
      var mark = document.querySelector('.sw-brand__mark');
      if (!mark) return;
      var img = document.createElement('img');
      img.className = 'sw-brand__badge';
      img.src = 'images/logo-150.jpg';
      img.alt = '';
      img.width = 36; img.height = 36;
      mark.replaceWith(img);
    })();
  </script>
</body>
</html>
