<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Orders - Krave Kulture</title>
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="images/logo-150.jpg">
  <link rel="preload" href="fonts/bungee-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/big-shoulders-text.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="order.css">
</head>
<body class="admin-page">
  <header class="admin-head">
    <div class="wrap admin-head-inner">
      <h1 class="display">Orders</h1>
      <div class="admin-tools" data-tools hidden>
        <label class="switch">
          <input type="checkbox" data-ordering>
          <span class="switch-track" aria-hidden="true"></span>
          <span data-ordering-label>Taking orders</span>
        </label>
        <button type="button" class="link-btn" data-logout>Sign out</button>
      </div>
    </div>
  </header>

  <main class="wrap admin-main">
    <form class="admin-login" data-login hidden>
      <h2 class="display">Sign in</h2>
      <div class="field">
        <label for="a-pass">Admin password</label>
        <input id="a-pass" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="form-error" data-login-error role="alert" hidden></p>
      <button class="btn btn-red" type="submit">Sign in</button>
    </form>

    <p class="form-error" data-setup-error role="alert" hidden></p>

    <section data-board hidden>
      <div class="tabs" role="tablist" aria-label="Which orders">
        <button type="button" role="tab" data-tab="new" aria-selected="true">Open <b data-count="new">0</b></button>
        <button type="button" role="tab" data-tab="done" aria-selected="false">Done <b data-count="done">0</b></button>
        <button type="button" role="tab" data-tab="all" aria-selected="false">All <b data-count="all">0</b></button>
      </div>
      <div class="admin-search">
        <label class="sr-only" for="a-search">Search orders by name, phone or order number</label>
        <input id="a-search" type="search" data-search placeholder="Search name, phone or #" autocomplete="off" enterkeyhint="search">
      </div>
      <p class="admin-note" data-updated aria-live="polite"></p>
      <ol class="tickets" data-tickets></ol>
      <p class="admin-empty" data-empty hidden>No orders here.</p>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
