<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://eatkravekulture.com/">
  <title>Krave Kulture has moved</title>
  <!-- Path-preserving: an old deep link such as /kravekulture/qr/krave-kulture-qr.pdf lands
       on the same file at the new host (Vercel's own 404 handles anything truly gone).
       The host stays hard-coded; only the path/query/hash are carried over. -->
  <script>location.replace('https://eatkravekulture.com' + location.pathname.replace(/^\/kravekulture(?=\/|$)/, '') + location.search + location.hash);</script>
</head>
<body>
  <p>Krave Kulture moved to <a href="https://eatkravekulture.com/">eatkravekulture.com</a>.</p>
</body>
</html>
